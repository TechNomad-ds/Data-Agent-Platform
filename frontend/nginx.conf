server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 允许大文件上传（后端 MAX_FILE_SIZE 为 200MB），否则 nginx 默认 1MB 会直接 413
    client_max_body_size 200M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        # Host-based deployment: backend gunicorn binds to 127.0.0.1:8002 by default.
        # If you run the frontend nginx inside Docker, change this to the backend service name.
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
